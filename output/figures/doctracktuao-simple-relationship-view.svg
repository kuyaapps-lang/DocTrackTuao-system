<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">DocTrackTuao simplified relationship view</title>
  <desc id="desc">A simple diagram showing Users, Offices, Roles, Documents, Document Routes, QR Codes, Processing History, and Audit Logs.</desc>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#374151"/></marker>
    <style>.bg{fill:#fff}.box{fill:#eaf3ff;stroke:#5b9bd5;stroke-width:2}.name{font:700 20px Arial,sans-serif;fill:#173f6d}.line{fill:none;stroke:#374151;stroke-width:2.5;marker-end:url(#arrow2)}.label{font:14px Arial,sans-serif;fill:#374151;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}.title{font:700 30px Arial,sans-serif;fill:#173f6d}</style>
  </defs>
  <rect class="bg" width="1500" height="800"/>
  <text class="title" x="750" y="55" text-anchor="middle">DocTrackTuao — Simple Relationship View</text>

  <path class="line" d="M340 235 H505"/><text class="label" x="423" y="218" text-anchor="middle">create and manage</text>
  <path class="line" d="M220 310 V454"/><text class="label" x="234" y="388">belong to</text>
  <path class="line" d="M220 455 H505"/><text class="label" x="365" y="441" text-anchor="middle">custody and routing</text>
  <path class="line" d="M220 170 V125 H100 V170"/><text class="label" x="160" y="115" text-anchor="middle">access rules</text>
  <path class="line" d="M780 235 H965"/><text class="label" x="872" y="218" text-anchor="middle">move through</text>
  <path class="line" d="M1080 310 V454 H780"/><text class="label" x="915" y="441" text-anchor="middle">sent from / received by</text>
  <path class="line" d="M640 310 V475"/><text class="label" x="654" y="397">has</text>
  <path class="line" d="M780 545 H965"/><text class="label" x="872" y="529" text-anchor="middle">records updates in</text>
  <path class="line" d="M340 605 H965"/><text class="label" x="650" y="590" text-anchor="middle">actions recorded in</text>
  <path class="line" d="M780 310 V605 H965"/><text class="label" x="880" y="589">activity</text>

  <rect class="box" x="100" y="170" width="240" height="140" rx="16"/><text class="name" x="220" y="245" text-anchor="middle">USERS</text>
  <rect class="box" x="10" y="35" width="180" height="90" rx="16"/><text class="name" x="100" y="88" text-anchor="middle">ROLES</text>
  <rect class="box" x="100" y="455" width="240" height="140" rx="16"/><text class="name" x="220" y="530" text-anchor="middle">OFFICES</text>
  <rect class="box" x="505" y="170" width="275" height="140" rx="16"/><text class="name" x="642" y="245" text-anchor="middle">DOCUMENTS</text>
  <rect class="box" x="965" y="170" width="275" height="140" rx="16"/><text class="name" x="1102" y="245" text-anchor="middle">DOCUMENT ROUTES</text>
  <rect class="box" x="505" y="475" width="275" height="140" rx="16"/><text class="name" x="642" y="550" text-anchor="middle">QR CODES</text>
  <rect class="box" x="965" y="475" width="275" height="140" rx="16"/><text class="name" x="1102" y="550" text-anchor="middle">PROCESSING HISTORY</text>
  <rect class="box" x="965" y="630" width="275" height="120" rx="16"/><text class="name" x="1102" y="700" text-anchor="middle">AUDIT LOGS</text>
</svg>
