<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">DocTrackTuao Data Model</title>
  <desc id="description">A refined data model showing the core relationships between users, offices, documents, routes, QR codes, processing logs, audit logs, and reference data.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0c356d"/><stop offset="1" stop-color="#078795"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#193d52" flood-opacity=".17"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#426575"/></marker>
    <style>.page{fill:#f7fbfd}.card{fill:#fff;stroke:#bdd0d9;stroke-width:1.25}.header{fill:url(#header)}.name{font:700 16px Arial,sans-serif;fill:#fff}.field{font:13px Arial,sans-serif;fill:#284755}.line{fill:none;stroke:#426575;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#71909b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}.label{font:12px Arial,sans-serif;fill:#365666;paint-order:stroke;stroke:#f7fbfd;stroke-width:6px;stroke-linejoin:round}.title{font:700 29px Arial,sans-serif;fill:#10366e}.sub{font:15px Arial,sans-serif;fill:#54707d}.section{font:700 12px Arial,sans-serif;fill:#5e7985;letter-spacing:1.2px}</style>
  </defs>
  <rect class="page" width="1600" height="1000"/>
  <text class="title" x="800" y="48" text-anchor="middle">DocTrackTuao — Data Model</text>
  <text class="sub" x="800" y="74" text-anchor="middle">Core records and relationships</text>
  <text class="section" x="95" y="120">ACCESS AND ORGANIZATION</text><text class="section" x="590" y="120">DOCUMENT WORKFLOW</text><text class="section" x="95" y="525">REFERENCE DATA</text><text class="section" x="590" y="525">DOCUMENT HISTORY AND ACCOUNTABILITY</text>
  <path class="line" d="M290 220 H350"/><text class="label" x="320" y="207" text-anchor="middle">assigns</text>
  <path class="line" d="M455 315 V360 H220 V315"/><text class="label" x="338" y="348" text-anchor="middle">assigned to</text>
  <path class="line" d="M560 220 H650"/><text class="label" x="605" y="207" text-anchor="middle">creates</text>
  <path class="line" d="M840 235 H990"/><text class="label" x="915" y="222" text-anchor="middle">has history</text>
  <path class="line" d="M1140 300 H1270"/><text class="label" x="1205" y="287" text-anchor="middle">moves between</text>
  <path class="line" d="M285 605 H620 V300 H650"/><text class="label" x="605" y="455" text-anchor="end">classifies</text>
  <path class="line" d="M505 675 H595 V330 H650"/><text class="label" x="582" y="494" text-anchor="end">prioritizes</text>
  <path class="line" d="M1270 550 V420 H840 V380"/><text class="label" x="1055" y="408" text-anchor="middle">sets current action</text>
  <path class="line" d="M745 380 V570"/><text class="label" x="760" y="475">has QR record</text>
  <path class="line" d="M745 700 V790"/><text class="label" x="760" y="755">has processing history</text>
  <path class="line" d="M1065 380 V790"/><text class="label" x="1080" y="625">may reference</text>
  <path class="line" d="M560 270 V850 H650"/><text class="label" x="605" y="838" text-anchor="middle">records</text>
  <path class="dash" d="M840 850 H990"/><text class="label" x="915" y="838" text-anchor="middle">activity logged in</text>
  <g filter="url(#shadow)"><rect class="card" x="95" y="145" width="195" height="110" rx="10"/><rect class="header" x="95" y="145" width="195" height="38" rx="10"/><rect class="header" x="95" y="173" width="195" height="10"/><text class="name" x="113" y="170">ROLES</text><text class="field" x="113" y="214">id · name</text></g>
  <g filter="url(#shadow)"><rect class="card" x="350" y="145" width="210" height="170" rx="10"/><rect class="header" x="350" y="145" width="210" height="38" rx="10"/><rect class="header" x="350" y="173" width="210" height="10"/><text class="name" x="368" y="170">USERS</text><text class="field" x="368" y="214">name · username</text><text class="field" x="368" y="238">email</text><text class="field" x="368" y="262">role · office</text></g>
  <g filter="url(#shadow)"><rect class="card" x="1270" y="145" width="220" height="145" rx="10"/><rect class="header" x="1270" y="145" width="220" height="38" rx="10"/><rect class="header" x="1270" y="173" width="220" height="10"/><text class="name" x="1288" y="170">OFFICES</text><text class="field" x="1288" y="214">office name</text><text class="field" x="1288" y="238">office code</text></g>
  <g filter="url(#shadow)"><rect class="card" x="650" y="135" width="190" height="245" rx="10"/><rect class="header" x="650" y="135" width="190" height="40" rx="10"/><rect class="header" x="650" y="165" width="190" height="10"/><text class="name" x="668" y="161">DOCUMENTS</text><text class="field" x="668" y="211">tracking no. · title</text><text class="field" x="668" y="235">origin / current office</text><text class="field" x="668" y="259">creator · current action</text><text class="field" x="668" y="283">document date · due date</text></g>
  <g filter="url(#shadow)"><rect class="card" x="990" y="145" width="150" height="235" rx="10"/><rect class="header" x="990" y="145" width="150" height="38" rx="10"/><rect class="header" x="990" y="173" width="150" height="10"/><text class="name" x="1008" y="170">ROUTES</text><text class="field" x="1008" y="211">document</text><text class="field" x="1008" y="235">from / to office</text><text class="field" x="1008" y="259">forwarded / received</text><text class="field" x="1008" y="283">remarks</text></g>
  <g filter="url(#shadow)"><rect class="card" x="95" y="550" width="190" height="110" rx="10"/><rect class="header" x="95" y="550" width="190" height="36" rx="10"/><rect class="header" x="95" y="576" width="190" height="10"/><text class="name" x="113" y="574">TYPES</text><text class="field" x="113" y="622">document category</text></g>
  <g filter="url(#shadow)"><rect class="card" x="315" y="620" width="190" height="110" rx="10"/><rect class="header" x="315" y="620" width="190" height="36" rx="10"/><rect class="header" x="315" y="646" width="190" height="10"/><text class="name" x="333" y="644">PRIORITIES</text><text class="field" x="333" y="692">priority level</text></g>
  <g filter="url(#shadow)"><rect class="card" x="1270" y="550" width="220" height="110" rx="10"/><rect class="header" x="1270" y="550" width="220" height="36" rx="10"/><rect class="header" x="1270" y="576" width="220" height="10"/><text class="name" x="1288" y="574">ACTIONS</text><text class="field" x="1288" y="622">processing action</text></g>
  <g filter="url(#shadow)"><rect class="card" x="650" y="570" width="190" height="130" rx="10"/><rect class="header" x="650" y="570" width="190" height="38" rx="10"/><rect class="header" x="650" y="598" width="190" height="10"/><text class="name" x="668" y="595">QR CODES</text><text class="field" x="668" y="637">QR token · status</text><text class="field" x="668" y="661">document · generator</text></g>
  <g filter="url(#shadow)"><rect class="card" x="650" y="790" width="190" height="145" rx="10"/><rect class="header" x="650" y="790" width="190" height="38" rx="10"/><rect class="header" x="650" y="818" width="190" height="10"/><text class="name" x="668" y="815">PROCESSING LOGS</text><text class="field" x="668" y="856">document · route</text><text class="field" x="668" y="880">office · user · action</text><text class="field" x="668" y="904">event type · note</text></g>
  <g filter="url(#shadow)"><rect class="card" x="990" y="790" width="220" height="145" rx="10"/><rect class="header" x="990" y="790" width="220" height="38" rx="10"/><rect class="header" x="990" y="818" width="220" height="10"/><text class="name" x="1008" y="815">AUDIT LOGS</text><text class="field" x="1008" y="856">user · module · action</text><text class="field" x="1008" y="880">record · description</text><text class="field" x="1008" y="904">time · IP address</text></g>
</svg>
